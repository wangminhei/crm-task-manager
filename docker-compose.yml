version: "3.8"

services:

db:
image: postgres:15
container_name: crm-db
restart: always
environment:
POSTGRES_USER: postgres
POSTGRES_PASSWORD: 123456
POSTGRES_DB: crm
ports:
- "5432:5432"
volumes:
- pgdata:/var/lib/postgresql/data

backend:
image: node:18
container_name: crm-backend
working_dir: /app
volumes:
- ./backend:/app
command: sh -c "npm install && node src/server.js"
ports:
- "3001:3001"
depends_on:
- db
environment:
DATABASE_URL: postgresql://postgres:123456@db:5432/crm
PORT: 3001

frontend:
image: node:18
container_name: crm-frontend
working_dir: /app
volumes:
- ./frontend:/app
command: sh -c "npm install && npm run dev"
ports:
- "3000:3000"
depends_on:
- backend

volumes:
pgdata:

