services:
  db:
    image: postgres:15
    container_name: nhat-ky-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: node:18-alpine
    container_name: nhat-ky-backend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "npm ci && npm run start"
    ports:
      - "${BACKEND_PORT}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: ${JWT_EXPIRES}
      FRONTEND_URL: ${FRONTEND_URL}

  frontend:
    image: node:18-alpine
    container_name: nhat-ky-frontend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    command: sh -c "npm ci --include=dev && npm run build && npm run start -- -H 0.0.0.0 -p 3000"
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

volumes:
  pgdata:

